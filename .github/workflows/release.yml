name: Build and publish downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: downloads-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Build the hosted copy at /app/
        run: npm run build:hosted

      - name: Package one ZIP per assistant and system
        run: node scripts/package-bundles.mjs --out bundles --manifest site/downloads.json

      - name: Publish the ZIPs on the downloads release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view downloads >/dev/null 2>&1 ||
            gh release create downloads --title "ExMonitor downloads" \
              --notes "The newest ZIPs, one per assistant and system. Each contains exactly one start file."
          # Remove files from the release that this build no longer produces, so a
          # renamed ZIP does not leave the old one behind next to it.
          while read -r asset; do
            [ -z "$asset" ] && continue
            [ -f "bundles/$asset" ] || gh release delete-asset downloads "$asset" --yes
          done < <(gh release view downloads --json assets --jq '.assets[].name')
          gh release upload downloads bundles/*.zip --clobber

      - name: Keep the ZIPs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExMonitor-zips
          path: bundles/*.zip
          retention-days: 14

      - name: Check Cloudflare secrets
        id: cloudflare
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not set. The download page was not deployed; the ZIPs are on the downloads release."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the download page
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
