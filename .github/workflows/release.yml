name: Build and publish downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: downloads-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Package one ZIP per assistant choice
        run: node scripts/package-bundles.mjs --out bundles --manifest site/downloads.json

      - name: Keep the ZIPs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ex-monitor-zips
          path: bundles/*.zip
          retention-days: 14

      - name: Check Cloudflare secrets
        id: cloudflare
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not set. The ZIPs are available in this workflow run only."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the ZIPs to R2
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for file in bundles/*.zip; do
            name=$(basename "$file")
            npx --yes wrangler@4 r2 object put "ex-monitor-downloads/$name" \
              --file "$file" \
              --content-type application/zip \
              --remote
          done

      - name: Deploy the download page
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
